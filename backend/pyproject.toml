[project]
name = "sourav-ai-portfolio-backend"
version = "1.0.0"
description = "Resume-grounded AI portfolio backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "pypdf>=5,<7",
    "groq>=1.7.0,<3",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
